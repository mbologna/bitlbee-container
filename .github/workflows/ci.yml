name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  docker:
    # Build, push, sign and scan the image; the auto-release job below releases.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@ea61923970085662e217bf6e40c26d98185a0b42 # main
    with:
      image_name: bitlbee
      # One of the two images also on Docker Hub (with saltstack-container):
      # docker-ci pushes to GHCR only unless asked.
      push_to_dockerhub: true
      # Only release tags publish the image (auto-release dispatches
      # their build); pull requests build it without pushing.
      publish: release
      yamllint_paths: docker-compose.yml .github/workflows/
      enable_integration_test: true
      # Image policy check: s6-overlay runs as root as PID 1 to supervise the
      # services, and each service drops to UID 1000 (s6-setuidgid).
      allow_root: >-
        s6-overlay runs as root as PID 1 to supervise the services; each
        service runs as UID 1000 (s6-setuidgid)
    secrets: inherit

  # Monday's schedule tags vX.Y.Z when a feat, fix, perf, revert or breaking commit
  # landed (or a maintenance release for dependency updates), a push to main tags
  # only a CVE fix; it dispatches the tag build that publishes the X.Y.Z image.
  auto-release:
    needs: [docker]
    # contents: push the tag and create the Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run).
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@ea61923970085662e217bf6e40c26d98185a0b42 # main
    with:
      strategy: conventional
      image: ghcr.io/mbologna/bitlbee
      dockerfiles: Dockerfile
      # Tags carry BitlBee's version as SemVer build metadata (v5.2.0+up3.6),
      # as mbologna/.github's VERSIONING.md describes.
      metadata_command: printf 'up%s' "$(sed -n 's/^ARG BITLBEE_VERSION=//p' Dockerfile)"
